services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: justwork
      POSTGRES_USER: justwork
      POSTGRES_PASSWORD: justwork
    ports:
      - "5432:5432"
    volumes:
      - justwork_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justwork -d justwork"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  justwork_postgres_data:
